[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosslayer"
version = "0.1.0"
description = "Cross-stack verification, experimentation and fault-localization platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "ruff>=0.6"]

[project.scripts]
crosslayer = "crosslayer.cli:main"

# Adapters are discovered through this entry-point group, so the core never
# imports an integration package directly.
[project.entry-points."crosslayer.adapters"]
sensor_pipeline = "crosslayer.integrations.sensor_pipeline:SensorPipelineAdapter"
rv32i = "crosslayer.integrations.rv32i:Rv32iAdapter"

[tool.setuptools.packages.find]
include = ["crosslayer*"]

[tool.setuptools.package-data]
"crosslayer.integrations.sensor_pipeline" = ["*.yaml", "fixtures/*.jsonl"]
"crosslayer.integrations.rv32i" = ["*.yaml", "rtl/*.v", "rtl/*.md", "programs/*.s"]
"crosslayer.scaffold" = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
