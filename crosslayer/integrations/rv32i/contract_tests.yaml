      - {t_us: 18, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 19, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
