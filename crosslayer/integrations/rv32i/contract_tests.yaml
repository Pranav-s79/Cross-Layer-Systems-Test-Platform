# yaml-language-server: $schema=../../../schemas/contract-tests.schema.json
# Known-good and known-bad cases for every RV32I boundary contract.
schema_version: 1
adapter: rv32i
cases:
  - name: sequential instructions advance by four bytes
    contract: rv32i.sequential_pc
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 0}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 4}}
  - name: sequential instruction skips an address
    contract: rv32i.sequential_pc
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 0}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 8}}

  - name: jump lands at its decoded target
    contract: rv32i.jump_target
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: jal, rv.pc: 0, rv.target: 16, rv.next_pc: 16}}
  - name: jump misses its decoded target
    contract: rv32i.jump_target
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: jal, rv.pc: 0, rv.target: 16, rv.next_pc: 4}}

  - name: the core is on the reference model's path
    contract: rv32i.reference_path
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 4, rv.ref_pc: 4, rv.insn: 19, rv.ref_insn: 19, rv.trap: 0, rv.ref_trap: 0}}
  - name: program counters diverge from the reference model
    contract: rv32i.reference_path
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 12, rv.ref_pc: 4, rv.insn: 19, rv.ref_insn: 19, rv.trap: 0, rv.ref_trap: 0}}

  - name: next PC is where the operands send it
    contract: rv32i.lockstep_control_flow
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.trap: 0, rv.next_pc: 40, rv.exp_next_pc: 40, rv.ref_next_pc: 8}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.trap: 1, rv.next_pc: 0, rv.exp_next_pc: 4}}
  - name: a branch decides against its operands
    contract: rv32i.lockstep_control_flow
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.trap: 0, rv.next_pc: 8, rv.exp_next_pc: 40}}

  - name: register operands match the reference model
    contract: rv32i.lockstep_operands
    expect: pass
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.timed: 1, rv.has_operands: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 10, rv.ref_rs1_val: 10, rv.rs2_val: 20, rv.ref_rs2_val: 20, rv.rs1_fwd: 0, rv.rs2_fwd: 0}}
  - name: operands of a different instruction are not compared (control flow already diverged)
    contract: rv32i.lockstep_operands
    expect: pass
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.timed: 1, rv.has_operands: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 12, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 11, rv.ref_rs1_val: 10, rv.rs2_val: 20, rv.ref_rs2_val: 20, rv.rs1_fwd: 0, rv.rs2_fwd: 0}}
  - name: register operand differs from the reference model
    contract: rv32i.lockstep_operands
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.timed: 1, rv.has_operands: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 11, rv.ref_rs1_val: 10, rv.rs2_val: 20, rv.ref_rs2_val: 20, rv.rs1_fwd: 0, rv.rs2_fwd: 0}}

  - name: register write is what the operands read call for
    contract: rv32i.lockstep_writeback
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.rd: 5, rv.exp_rd: 5, rv.rd_val: 42, rv.exp_rd_val: 42}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: load, rv.rd: 6, rv.exp_rd: 6, rv.rd_val: 1, rv.exp_rd_val: 2}}
  - name: a result computed from a stale operand is consistent with it
    contract: rv32i.lockstep_writeback
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.rd: 5, rv.exp_rd: 5, rv.rd_val: 41, rv.exp_rd_val: 41, rv.ref_rd_val: 42}}
  - name: register write differs from what the operands call for
    contract: rv32i.lockstep_writeback
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.rd: 5, rv.exp_rd: 5, rv.rd_val: 41, rv.exp_rd_val: 42}}

  - name: loaded value matches the reference model
    contract: rv32i.load_data
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: load, rv.rd: 6, rv.exp_rd: 6, rv.rd_val: 2, rv.exp_rd_val: 2}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.rd: 5, rv.exp_rd: 5, rv.rd_val: 1, rv.exp_rd_val: 9}}
  - name: loaded value differs from the reference model
    contract: rv32i.load_data
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: load, rv.rd: 6, rv.exp_rd: 6, rv.rd_val: 1, rv.exp_rd_val: 2}}

  - name: memory write matches the reference model
    contract: rv32i.lockstep_memory
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.mem_addr: 4096, rv.exp_mem_addr: 4096, rv.mem_wmask: 15, rv.exp_mem_wmask: 15, rv.mem_wdata: 42, rv.exp_mem_wdata: 42}}
  - name: memory byte lanes differ from the reference model
    contract: rv32i.lockstep_memory
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.mem_addr: 4096, rv.exp_mem_addr: 4096, rv.mem_wmask: 1, rv.exp_mem_wmask: 2, rv.mem_wdata: 42, rv.exp_mem_wdata: 10752}}

  - name: output value matches the reference model
    contract: rv32i.program_output
    expect: pass
    events:
      - {t_us: 1, type: cpu.output, subsystem: mmio, attrs: {rv.data: 42, rv.ref_data: 42}}
  - name: output value differs from the reference model
    contract: rv32i.program_output
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.output, subsystem: mmio, attrs: {rv.data: 41, rv.ref_data: 42}}

  - name: program reaches ebreak after the expected retire count
    contract: rv32i.clean_halt
    expect: pass
    events:
      - {t_us: 1, type: cpu.halt, subsystem: tb, attrs: {rv.halt_reason: ebreak, rv.retired: 5, rv.ref_retired: 5}}
  - name: program halts with the wrong retire count
    contract: rv32i.clean_halt
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.halt, subsystem: tb, attrs: {rv.halt_reason: ebreak, rv.retired: 4, rv.ref_retired: 5}}

  - name: completed run has no bus errors
    contract: rv32i.no_bus_errors
    expect: pass
    events:
      - {t_us: 1, type: cpu.halt, subsystem: tb}
  - name: completed run records an unmapped access
    contract: rv32i.no_bus_errors
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.bus_error, subsystem: memory}
      - {t_us: 2, type: cpu.halt, subsystem: tb}

  - name: p95 cycles per instruction stays within budget
    contract: rv32i.cpi_budget
    expect: pass
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.timed: 1, rv.has_operands: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 3, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 4, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 5, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 6, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
