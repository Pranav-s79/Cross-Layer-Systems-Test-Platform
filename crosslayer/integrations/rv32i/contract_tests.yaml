# yaml-language-server: $schema=../../../schemas/contract-tests.schema.json
# Known-good and known-bad cases for every RV32I boundary contract.
schema_version: 1
adapter: rv32i
cases:
  - name: sequential instructions advance by four bytes
    contract: rv32i.sequential_pc
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 0}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 4}}
  - name: sequential instruction skips an address
    contract: rv32i.sequential_pc
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 0}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 8}}

  - name: jump lands at its decoded target
    contract: rv32i.jump_target
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: jal, rv.pc: 0, rv.target: 16, rv.next_pc: 16}}
  - name: jump misses its decoded target
    contract: rv32i.jump_target
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: jal, rv.pc: 0, rv.target: 16, rv.next_pc: 4}}

  - name: control flow matches the reference model
    contract: rv32i.lockstep_control_flow
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 4, rv.ref_pc: 4, rv.insn: 19, rv.ref_insn: 19, rv.trap: 0, rv.ref_trap: 0, rv.next_pc: 8, rv.ref_next_pc: 8}}
  - name: program counters diverge from the reference model
    contract: rv32i.lockstep_control_flow
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 12, rv.ref_pc: 4, rv.insn: 19, rv.ref_insn: 19, rv.trap: 0, rv.ref_trap: 0, rv.next_pc: 16, rv.ref_next_pc: 8}}

  - name: register operands match the reference model
    contract: rv32i.lockstep_operands
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.rs1_val: 10, rv.ref_rs1_val: 10, rv.rs2_val: 20, rv.ref_rs2_val: 20}}
  - name: register operand differs from the reference model
    contract: rv32i.lockstep_operands
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.rs1_val: 11, rv.ref_rs1_val: 10, rv.rs2_val: 20, rv.ref_rs2_val: 20}}

  - name: register writeback matches the reference model
    contract: rv32i.lockstep_writeback
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.rd: 5, rv.ref_rd: 5, rv.rd_val: 42, rv.ref_rd_val: 42}}
  - name: register writeback differs from the reference model
    contract: rv32i.lockstep_writeback
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.rd: 5, rv.ref_rd: 5, rv.rd_val: 41, rv.ref_rd_val: 42}}

  - name: memory write matches the reference model
    contract: rv32i.lockstep_memory
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.mem_addr: 4096, rv.ref_mem_addr: 4096, rv.mem_wmask: 15, rv.ref_mem_wmask: 15, rv.mem_wdata: 42, rv.ref_mem_wdata: 42}}
  - name: memory byte lanes differ from the reference model
    contract: rv32i.lockstep_memory
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.mem_addr: 4096, rv.ref_mem_addr: 4096, rv.mem_wmask: 1, rv.ref_mem_wmask: 2, rv.mem_wdata: 42, rv.ref_mem_wdata: 10752}}

  - name: output value matches the reference model
    contract: rv32i.program_output
    expect: pass
    events:
      - {t_us: 1, type: cpu.output, subsystem: mmio, attrs: {rv.data: 42, rv.ref_data: 42}}
  - name: output value differs from the reference model
    contract: rv32i.program_output
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.output, subsystem: mmio, attrs: {rv.data: 41, rv.ref_data: 42}}

  - name: program reaches ebreak after the expected retire count
    contract: rv32i.clean_halt
    expect: pass
    events:
      - {t_us: 1, type: cpu.halt, subsystem: tb, attrs: {rv.halt_reason: ebreak, rv.retired: 5, rv.ref_retired: 5}}
  - name: program halts with the wrong retire count
    contract: rv32i.clean_halt
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.halt, subsystem: tb, attrs: {rv.halt_reason: ebreak, rv.retired: 4, rv.ref_retired: 5}}

  - name: completed run has no bus errors
    contract: rv32i.no_bus_errors
    expect: pass
    events:
      - {t_us: 1, type: cpu.halt, subsystem: tb}
  - name: completed run records an unmapped access
    contract: rv32i.no_bus_errors
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 1, type: cpu.bus_error, subsystem: memory}
      - {t_us: 2, type: cpu.halt, subsystem: tb}

  - name: p95 cycles per instruction stays within budget
    contract: rv32i.cpi_budget
    expect: pass
    events:
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.cpi: 4}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.cpi: 4}}
      - {t_us: 3, type: cpu.retire, subsystem: core, attrs: {rv.cpi: 4}}
