      - {t_us: 47, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 48, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 12}}
      - {t_us: 49, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 12}}
      - {t_us: 50, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 12}}

  - name: a forwarded operand is left to the forwarding contract
    contract: rv32i.lockstep_operands
    expect: pass
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.timed: 1, rv.has_operands: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 11, rv.ref_rs1_val: 10, rv.rs2_val: 20, rv.ref_rs2_val: 20, rv.rs1_fwd: 1, rv.rs2_fwd: 0}}

  - name: forwarded operands match the reference model
    contract: rv32i.forwarded_operands
    expect: pass
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.has_operands: 1, rv.bypass_window: 2}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 10, rv.ref_rs1_val: 10, rv.rs2_val: 7, rv.ref_rs2_val: 20, rv.rs1_fwd: 1, rv.rs2_fwd: 0}}
  - name: a forwarded operand is stale
    contract: rv32i.forwarded_operands
    expect: fail
    expect_violations: 1
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.has_operands: 1, rv.bypass_window: 2}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 10, rv.ref_rs1_val: 10, rv.rs2_val: 7, rv.ref_rs2_val: 20, rv.rs1_fwd: 0, rv.rs2_fwd: 1}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 3, rv.ref_rs1_val: 4, rv.rs2_val: 0, rv.ref_rs2_val: 0, rv.rs1_fwd: 0, rv.rs2_fwd: 0}}
  - name: forwarding check does not apply to a core without a bypass
    contract: rv32i.forwarded_operands
    expect: skipped
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.has_operands: 1, rv.bypass_window: 0}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.pc: 8, rv.ref_pc: 8, rv.insn: 51, rv.ref_insn: 51, rv.rs1_val: 11, rv.ref_rs1_val: 10, rv.rs2_val: 0, rv.ref_rs2_val: 0, rv.rs1_fwd: 0, rv.rs2_fwd: 0}}

  - name: the instruction after a taken branch is its target
    contract: rv32i.redirect_followed
    expect: pass
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.pipelined: 1, rv.has_next_pc: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.kind: branch, rv.trap: 0, rv.pc: 0, rv.next_pc: 32}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.kind: alu, rv.trap: 0, rv.pc: 32, rv.next_pc: 36}}
