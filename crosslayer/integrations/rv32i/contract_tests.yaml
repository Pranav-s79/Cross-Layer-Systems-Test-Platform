      - {t_us: 14, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 15, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 16, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 17, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 18, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 19, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
