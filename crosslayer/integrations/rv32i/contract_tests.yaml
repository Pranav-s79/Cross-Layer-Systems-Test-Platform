      - {t_us: 34, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 35, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
