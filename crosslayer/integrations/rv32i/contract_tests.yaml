      - {t_us: 48, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 49, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 50, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
  - name: three slow instructions push p95 over budget
    contract: rv32i.cpi_budget
    expect: fail
    events:
      - {t_us: 0, type: cpu.boot, subsystem: tb, attrs: {rv.timed: 1, rv.has_operands: 1}}
      - {t_us: 1, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 2, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 3, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 4, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 5, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 6, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
      - {t_us: 7, type: cpu.retire, subsystem: core, attrs: {rv.op: add, rv.cpi: 4}}
