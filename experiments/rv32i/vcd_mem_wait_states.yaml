# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: rv32i-vcd-mem-wait-states
description: >
  Slow memory seen through the waveform. Unlike a commit log, a waveform has
  cycles, so the timing-only fault trips cpi_budget. Ground truth: memory
  (interface instruction_bus).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  program: selftest
  max_cycles: 100000
  trace: vcd-signals
faults:
  - name: mem_wait_states
    params: {cycles: 3}
