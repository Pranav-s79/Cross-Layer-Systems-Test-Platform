# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: pipeline-no-mem-forwarding
description: >
  Execute no longer receives results from the memory stage (the instruction
  just ahead). Ground truth: hazard (interface bypass).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: learnfpga-pipeline
  program: selftest
  max_cycles: 20000   # a clean self-test run takes about 880 cycles
faults:
  - no_mem_forwarding
