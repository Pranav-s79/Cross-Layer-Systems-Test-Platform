# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: pipeline-slt-unsigned
description: >
  Signed compares (SLT, SLTI, BLT, BGE) compare unsigned. Ground truth: alu
  (interface writeback).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: learnfpga-pipeline
  program: selftest
  max_cycles: 20000   # a clean self-test run takes about 880 cycles
faults:
  - slt_unsigned
