# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: pipeline-store-byte-lane
description: >
  SB always writes byte lane 0 of the word. Ground truth: lsu (interface
  data_bus).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: learnfpga-pipeline
  program: selftest
  max_cycles: 20000   # a clean self-test run takes about 880 cycles
faults:
  - store_byte_lane
