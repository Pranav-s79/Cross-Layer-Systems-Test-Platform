# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: pipeline-vcd-baseline
description: >
  The pipeline baseline sampled from the monitor's waveform.
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: learnfpga-pipeline
  program: selftest
  max_cycles: 20000   # a clean self-test run takes about 880 cycles
  trace: vcd-signals
