# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: pipeline-hazard-no-load-use-stall
description: >
  Hazard-mix random programs on the no_load_use_stall mutant (a load followed by a use of its result no longer stalls).
  Every seed must catch it. Ground truth: hazard.
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: learnfpga-pipeline
  program: random
  random_mix: hazards
  random_instructions: 300
  max_cycles: 20000
faults:
  - no_load_use_stall
