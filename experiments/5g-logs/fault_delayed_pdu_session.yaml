# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: 5g-logs-synthetic-fixture-delayed-pdu-session
description: SYNTHETIC FIXTURE fault with the gNB PDU-session completion delayed beyond its contract.
adapter: textlog
seed: 1
timeout_s: 60
inputs: [logs/amf.log, logs/smf.log, logs/gnb_delayed_pdu_session.log]
parameters:
  sources:
    - {input: logs/amf.log, profile: open5gs_amf, year: 2026, utc_offset: "+00:00"}
    - {input: logs/smf.log, profile: open5gs_smf, year: 2026, utc_offset: "+00:00"}
    - {input: logs/gnb_delayed_pdu_session.log, profile: ocudu_gnb, utc_offset: "+00:00"}
  joins:
    - {name: ngap_ue, keys: [ran_ue_ngap_id, amf_ue_ngap_id], fallback_window_ms: 250}
contracts: [contracts.yaml]
ground_truth: {subsystem: ngap, note: "the gNB's NGAP PDU session setup completes late"}
