# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: 5g-logs-synthetic-fixture-two-ues-dropped-registration
description: >
  SYNTHETIC FIXTURE: only UE 2's Registration complete is missing. UE 1's
  completion must not satisfy UE 2's request, so registration_completes
  fails for UE 2 alone. Ground truth: amf.
adapter: textlog
seed: 1
timeout_s: 60
inputs: [logs/two_ues_amf_ue2_registration_dropped.log, logs/two_ues_smf.log, logs/two_ues_gnb.log]
parameters:
  sources:
    - {input: logs/two_ues_amf_ue2_registration_dropped.log, profile: open5gs_amf, year: 2026, utc_offset: "+00:00"}
    - {input: logs/two_ues_smf.log, profile: open5gs_smf, year: 2026, utc_offset: "+00:00"}
    - {input: logs/two_ues_gnb.log, profile: ocudu_gnb, utc_offset: "+00:00", offset_ms: 40}
  joins:
    - {name: ngap_ue, keys: [ran_ue_ngap_id, amf_ue_ngap_id], fallback_window_ms: 250}
contracts: [contracts.yaml]
