# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: quark-bne-inverted
description: >
  BNE branches when its operands are equal. Ground truth: alu (interface branch_decision).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: femtorv32-quark
  program: selftest
  max_cycles: 20000   # a clean run takes about 2,100 cycles (4,400 with wait states)
faults:
  - bne_inverted
