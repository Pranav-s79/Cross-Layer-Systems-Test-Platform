# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: quark-commit-log-baseline
description: >
  The Quark baseline through a Spike-style commit log printed by the monitor.
  lockstep_operands and cpi_budget are SKIPPED (no operand values or cycles).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: femtorv32-quark
  program: selftest
  max_cycles: 20000   # a clean run takes about 2,100 cycles (4,400 with wait states)
  trace: commit-log
