# yaml-language-server: $schema=../../schemas/suite.schema.json
schema_version: 1
name: rv32i-quark
description: >
  FemtoRV32 Quark, a second core with no RVFI port, verified through a
  testbench retirement monitor and its waveform. The clean core must match the
  reference model; every mutant and the timing fault must then be detected.
experiments:
  - id: baseline
    path: baseline.yaml
  - id: commit_log_baseline
    path: commit_log_baseline.yaml
    depends_on: [baseline]
  - id: bne_inverted
    path: fault_bne_inverted.yaml
    expect: fail
    depends_on: [baseline]
  - id: sub_as_add
    path: fault_sub_as_add.yaml
    expect: fail
    depends_on: [baseline]
  - id: slt_unsigned
    path: fault_slt_unsigned.yaml
    expect: fail
    depends_on: [baseline]
  - id: jal_imm_bit11
    path: fault_jal_imm_bit11.yaml
    expect: fail
    depends_on: [baseline]
  - id: regfile_wrong_rd
    path: fault_regfile_wrong_rd.yaml
    expect: fail
    depends_on: [baseline]
  - id: store_byte_lane
    path: fault_store_byte_lane.yaml
    expect: fail
    depends_on: [baseline]
  - id: mem_wait_states
    path: fault_mem_wait_states.yaml
    expect: fail
    depends_on: [baseline]
