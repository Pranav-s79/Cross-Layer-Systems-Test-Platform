# yaml-language-server: $schema=../../schemas/experiment.schema.json
schema_version: 1
name: quark-jal-imm-bit11
description: >
  The JAL target ignores bit 11 of the immediate. Ground truth: decoder (interface jump_target).
adapter: rv32i
seed: 1
timeout_s: 120
parameters:
  core: femtorv32-quark
  program: selftest
  max_cycles: 20000   # a clean run takes about 2,100 cycles (4,400 with wait states)
faults:
  - jal_imm_bit11
