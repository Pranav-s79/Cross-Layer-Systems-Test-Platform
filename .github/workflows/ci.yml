name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install ruff mypy PyYAML
      - name: Ruff (pyflakes rules)
        run: ruff check .
      - name: Mypy (core and cli.py)
        run: mypy

  coverage:
    name: coverage (crosslayer/core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests with coverage (report only, no threshold)
        run: python -m pytest --cov=crosslayer/core --cov-report=term-missing

  reference-experiments:
    name: reference experiments
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Lint contracts and experiments
        run: crosslayer lint experiments/reference/suite.yaml --strict
      - name: Contract tests (every contract has a known-good and known-bad case)
        run: crosslayer test-contracts crosslayer/integrations/sensor_pipeline/contract_tests.yaml --require-coverage
      - name: Reference suite (baseline passes, every injected fault is detected)
        run: crosslayer suite experiments/reference/suite.yaml --out runs -j auto
      - name: Log analysis example (textlog, synthetic two-source fixture)
        run: |
          crosslayer lint experiments/textlog/suite.yaml --strict
          crosslayer test-contracts experiments/textlog/contract_tests.yaml --require-coverage
          crosslayer suite experiments/textlog/suite.yaml --out runs -j auto
      - name: 5G log analysis (synthetic Open5GS and OCUDU fixtures)
        run: |
          crosslayer lint experiments/5g-logs/suite.yaml --strict
          crosslayer test-contracts experiments/5g-logs/contract_tests.yaml --require-coverage
          crosslayer suite experiments/5g-logs/suite.yaml --out runs -j auto
      - name: Fault localization accuracy (reference, textlog, 5G)
        run: crosslayer localize runs --score --min-top1 0.5 --min-top3 1.0
      - name: Upload run bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-bundles
          path: runs/

  rv32i-experiments:
    name: RV32I RTL experiments
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog
      - name: Install CrossLayer
        run: python -m pip install -e ".[dev]"
      - name: RV32I adapter and simulator integration tests
        run: python -m pytest -q tests/integrations/test_rv32i.py tests/integrations/test_rv32i_pipeline.py
      - name: Lint RV32I contracts and experiments
        run: crosslayer lint experiments/rv32i/suite.yaml --strict
      - name: RV32I contract tests
        run: crosslayer test-contracts crosslayer/integrations/rv32i/contract_tests.yaml --require-coverage
      - name: RV32I suite (baseline passes, every injected fault is detected)
        run: crosslayer suite experiments/rv32i/suite.yaml --out runs -j auto
      - name: Second core without RVFI (FemtoRV32 Quark)
        run: |
          crosslayer lint experiments/rv32i-quark/suite.yaml --strict
          crosslayer suite experiments/rv32i-quark/suite.yaml --out runs -j auto
      - name: Pipelined core (hazard mutants, hazard sweeps)
        run: |
          crosslayer lint experiments/rv32i-pipeline/suite.yaml --strict
          crosslayer suite experiments/rv32i-pipeline/suite.yaml --out runs -j auto
      - name: Fault localization accuracy (all three RV32I cores)
        run: crosslayer localize runs --score --min-top1 0.5 --min-top3 1.0
      - name: Upload RV32I run bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32i-run-bundles
          path: runs/
