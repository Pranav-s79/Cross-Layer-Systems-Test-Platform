name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install ruff
      - name: Ruff (pyflakes rules)
        run: ruff check .

  reference-experiments:
    name: reference experiments
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Lint contracts and experiments
        run: crosslayer lint experiments/reference/suite.yaml --strict
      - name: Contract tests (every contract has a known-good and known-bad case)
        run: crosslayer test-contracts crosslayer/integrations/sensor_pipeline/contract_tests.yaml --require-coverage
      - name: Reference suite (baseline passes, every injected fault is detected)
        run: crosslayer suite experiments/reference/suite.yaml --out runs
      - name: Upload run bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-bundles
          path: runs/
