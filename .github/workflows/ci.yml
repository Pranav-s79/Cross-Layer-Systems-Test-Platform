name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest

  reference-experiments:
    name: reference experiments
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Baseline must pass
        run: crosslayer run experiments/reference/baseline.yaml --out runs
      - name: Every injected fault must be detected (exit code 1 = FAIL)
        shell: bash
        run: |
          for experiment in experiments/reference/fault_*.yaml; do
            set +e
            crosslayer run "$experiment" --out runs --quiet
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then
              echo "::error::expected FAIL (exit 1) for $experiment, got exit $code"
              exit 1
            fi
          done
      - name: Upload run bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-bundles
          path: runs/
